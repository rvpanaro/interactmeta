url: https://rvpanaro.github.io/interactmeta/

authors:
  Renato Valladares Panaro:
    href: https://orcid.org/0000-0002-1903-2091
  Christian Röver:
    href: https://orcid.org/0000-0002-6911-698X
  Tim Friede:
    href: https://orcid.org/0000-0001-5347-7441
  sidebar:
    roles: [aut, cre, ctb, rev, ths]

repo:
  url:
    home: https://github.com/rvpanaro/interactmeta/
    source: https://github.com/rvpanaro/interactmeta/blob/HEAD/
    issue: https://github.com/rvpanaro/interactmeta/issues/
  branch: master

articles:
- title: Getting started with CAMS
  desc: Paper walk-through on age (Bayesian) and steroids (REML).
  contents:
  - cams
- title: After CAMS
  desc: Heterogeneity, traceplots, and DA/AD/SWADA (after vignette("cams")).
  contents:
  - "heterogeneity-after-cams"
  - "comparing-da-ad-swada"
- title: Example datasets
  desc: Catalog of package data with sample rows and links to the main vignettes.
  contents:
  - "worked-examples"

redirects:
- [articles/introduction-to-interact.html, articles/cams.html]
- [articles/consistent-interactions.html, articles/comparing-da-ad-swada.html]
- [articles/export-and-qc.html, articles/cams.html]
- [articles/convolution.html, articles/cams.html]
- [articles/engine-comparison.html, articles/cams.html]
- [articles/diagnostics.html, articles/cams.html]
- [articles/further.html, articles/heterogeneity-after-cams.html]
- [articles/single-subgroup-trials.html, articles/cams.html]
- [articles/trial-specific-effects-and-shrinkage.html, articles/cams.html]
- [articles/traceplots.html, articles/heterogeneity-after-cams.html]

template:
  bootstrap: 5

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

